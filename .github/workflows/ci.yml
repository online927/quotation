name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Build
        run: dotnet build Quotation.sln -c Release
      - name: Test
        run: dotnet test Quotation.sln -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/*.trx"

  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test on Windows (DPAPI, paths)
        run: dotnet test Quotation.sln -c Release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Publish and build installers
        shell: pwsh
        run: ./installer/publish.ps1 -Version "0.9.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: publish/installers/
